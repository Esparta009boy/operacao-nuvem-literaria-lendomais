name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "URL publica da API no Render (ex: https://lendomais-api.onrender.com)"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lendomais-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lendomais-frontend:latest